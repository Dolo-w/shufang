<style>
  :root{
    --paper:#f5eeda; --paper2:#eee2c6; --ink:#2b2419; --ink2:#6b5f49;
    --cinnabar:#a4342a; --gold:#a07c1c;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:'KaiTi','STKaiti','Kaiti SC','STSong','SimSun',serif;
    background:
      radial-gradient(1100px 480px at 50% -120px, rgba(164,52,42,.14), transparent 60%),
      #191510;
    color:#b3a586;min-height:100vh;display:flex;flex-direction:column;align-items:center;
    padding:44px 16px 60px;
  }
  .wrap{width:100%;max-width:520px}
  header{text-align:center;margin-bottom:26px}
  header h1{font-size:34px;letter-spacing:12px;text-indent:12px;color:#e8d5a8;font-weight:600}
  header .sub{margin-top:10px;font-size:12.5px;letter-spacing:4px;text-indent:4px;color:#8d8167}
  .paper{
    background:linear-gradient(160deg,var(--paper) 60%,var(--paper2));
    border:1px solid #cbb98e;border-radius:6px;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 0 70px rgba(158,120,50,.10);
    padding:34px 26px 28px;position:relative;
  }
  .paper::before{
    content:'';position:absolute;inset:10px;pointer-events:none;border-radius:3px;
    border:1px solid rgba(164,52,42,.30);
  }
  .date{text-align:center;color:#6b5f49;font-size:13px;letter-spacing:3px}
  .gz{text-align:center;margin-top:12px;font-size:15px;color:#2b2419;letter-spacing:2px}
  .gz b{color:var(--cinnabar);font-weight:600}
  .gz .ss{display:inline-block;margin-left:8px;padding:1px 8px;font-size:11px;letter-spacing:1px;
    border:1px solid rgba(164,52,42,.35);border-radius:10px;color:var(--cinnabar)}
  .divider{margin:22px auto;width:60%;height:1px;background:linear-gradient(90deg,transparent,rgba(160,124,28,.45),transparent)}
  .cols{display:flex;gap:18px}
  .col{flex:1}
  .col .k{font-size:13px;letter-spacing:4px;margin-bottom:10px}
  .col.yi .k{color:var(--cinnabar)}
  .col.ji .k{color:#4a3f2f}
  .col ul{list-style:none}
  .col li{font-size:13.5px;line-height:2.1;color:#4a3f2f;letter-spacing:.5px}
  .col li::before{content:'·';margin-right:6px;color:#a89a79}
  .line{margin-top:24px;padding-top:18px;border-top:1px dashed #c2ae7f;
    font-size:14px;line-height:2;color:#3b3122;letter-spacing:.5px;text-align:center}
  .line .sub2{display:block;margin-top:6px;font-size:12.5px;color:#8a7c5f;letter-spacing:.5px}
  .foot{margin-top:14px;text-align:center;font-size:11px;color:#8a7c5f;letter-spacing:1px}
  .btns{display:flex;gap:10px;margin-top:22px}
  .btn{
    flex:1;background:transparent;border:1px solid rgba(179,165,134,.45);color:#c9b98f;
    border-radius:4px;padding:11px 0;font-family:inherit;font-size:13px;letter-spacing:3px;
    cursor:pointer;transition:background .15s,color .15s;
  }
  .btn:hover{background:rgba(179,165,134,.12);color:#f0e6cf}
  .btn.ghost{color:#8d8167;border-color:rgba(179,165,134,.25)}
  .setup{display:none}
  .setup.on{display:block}
  .setup label{display:block;font-size:12.5px;color:#8d8167;letter-spacing:1px;margin-bottom:8px}
  /* 国风日历盘 */
  .dp{position:relative}
  .dp-field{
    width:100%;padding:11px 12px;font-family:inherit;font-size:14px;text-align:left;cursor:pointer;
    color:#8d8167;letter-spacing:1px;background:rgba(245,238,218,.04);
    border:1px solid rgba(179,165,134,.28);border-radius:4px;transition:border-color .15s;
  }
  .dp-field.filled{color:#e6dcc4}
  .dp-field:hover,.dp-field:focus{border-color:rgba(179,165,134,.6);outline:none}
  .dp-panel{
    position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:9;
    background:linear-gradient(160deg,#f5eeda,#eee2c6);
    border:1px solid #c9b785;border-radius:6px;padding:12px 12px 14px;
    box-shadow:0 16px 40px rgba(0,0,0,.55);color:#2b2419;
  }
  .dp-head{display:flex;align-items:center;gap:4px;margin-bottom:10px}
  .dp-title{flex:1;text-align:center;font-size:14px;color:#a4342a;letter-spacing:2px}
  .dp-nav{
    width:28px;height:28px;border:1px solid #c9b785;border-radius:4px;cursor:pointer;
    background:rgba(255,252,244,.85);font-family:inherit;color:#6b5f49;font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;
  }
  .dp-nav:hover{border-color:#a4342a;color:#a4342a}
  .dp-week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px}
  .dp-week span{text-align:center;font-size:10.5px;color:#2f4f52}
  .dp-days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
  .dp-day{
    height:32px;padding:0;border:1px solid transparent;background:transparent;border-radius:4px;
    font-family:inherit;font-size:13px;color:#2b2419;cursor:pointer;
  }
  .dp-day:hover{border-color:#c9b785;background:rgba(255,252,244,.95)}
  .dp-day.on{background:linear-gradient(160deg,#b23c30,#8c2a21);color:#f8efdc;border-color:#8c2a21}
  .dp-day.blank{visibility:hidden;pointer-events:none}
  .setup .hint{margin-top:10px;font-size:11.5px;color:#6f6552;line-height:1.8}
  #posterBox{display:none;margin-top:18px;text-align:center}
  #posterBox.on{display:block}
  #posterCanvas{width:100%;max-width:320px;border:1px solid rgba(179,165,134,.3);border-radius:4px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .toast{position:fixed;left:50%;bottom:40px;transform:translateX(-50%) translateY(20px);
    background:rgba(35,29,20,.95);border:1px solid rgba(179,165,134,.35);color:#e6dcc4;
    padding:9px 18px;border-radius:4px;font-size:12.5px;letter-spacing:1px;opacity:0;
    transition:opacity .2s,transform .2s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media (max-width:420px){ .cols{flex-direction:column;gap:14px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>一纸日签</h1>
    <div class="sub">同 一 人 · 同 一 天 · 同 一 签</div>
  </header>

  <div class="paper">
    <div class="date" id="dDate">—</div>
    <div class="gz" id="dGz">—</div>
    <div class="divider"></div>
    <div class="cols" id="dCols">
      <div class="col yi"><div class="k">宜</div><ul id="dYi"></ul></div>
      <div class="col ji"><div class="k">忌</div><ul id="dJi"></ul></div>
    </div>
    <div class="line" id="dLine"></div>
    <div class="foot" id="dFoot"></div>
  </div>

  <div class="btns">
    <button class="btn" id="savePngBtn">存 成 图 片</button>
    <button class="btn ghost" id="copyBtn">复 制 签 文</button>
  </div>
  <div class="btns">
    <button class="btn ghost" id="linkBtn">复 制 链 接</button>
    <button class="btn ghost" id="resetBtn">换 生 辰</button>
  </div>

  <div id="posterBox"><canvas id="posterCanvas" width="750" height="1334"></canvas></div>

  <div class="setup" id="setup">
    <label>你的出生日期（日签只用日柱，不用时辰）</label>
    <div class="dp" id="dpWrap">
      <button type="button" class="dp-field" id="dpField">点选出生日期</button>
      <input type="hidden" id="fDate" value="">
    </div>
    <div class="hint">在「一纸命笺」里填过的话，这里会自动带上；日柱按日期推算，23 点后出生者可能差一柱。</div>
    <div class="btns"><button class="btn" id="saveBtn">起 签</button></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
  var ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
  var GAN_WX = ['木','木','火','火','土','土','金','金','水','水'];
  var GAN_YANG = {'甲':1,'丙':1,'戊':1,'庚':1,'壬':1};
  var SS_SHENG = {木:'火',火:'土',土:'金',金:'水',水:'木'};
  var SS_KE = {木:'土',土:'水',水:'火',火:'金',金:'木'};
  var KEY = 'shufang_birth';

  function jdn(y,m,d){
    if(m<=2){ y-=1; m+=12; }
    var A = Math.floor(y/100), B = 2 - A + Math.floor(A/4);
    return Math.floor(365.25*(y+4716)) + Math.floor(30.6001*(m+1)) + d + B - 1524;
  }
  function dayGz(y,m,d){
    var i = ((jdn(y,m,d) + 49) % 60 + 60) % 60;
    return GAN[i%10] + ZHI[i%12];
  }
  function shiShen(dayGan, otherGan){
    var dW = GAN_WX[GAN.indexOf(dayGan)], oW = GAN_WX[GAN.indexOf(otherGan)];
    var same = (GAN_YANG[dayGan]?1:0) === (GAN_YANG[otherGan]?1:0);
    if(dW===oW) return same?'比肩':'劫财';
    if(SS_SHENG[dW]===oW) return same?'食神':'伤官';
    if(SS_KE[dW]===oW) return same?'偏财':'正财';
    if(SS_KE[oW]===dW) return same?'七杀':'正官';
    return same?'偏印':'正印';
  }
  function rel(a,b){
    // 地支关系：六合 / 六冲 / 相害 / 无
    var HE = {子:'丑',丑:'子',寅:'亥',亥:'寅',卯:'戌',戌:'卯',辰:'酉',酉:'辰',巳:'申',申:'巳',午:'未',未:'午'};
    var CHONG = {子:'午',午:'子',丑:'未',未:'丑',寅:'申',申:'寅',卯:'酉',酉:'卯',辰:'戌',戌:'辰',巳:'亥',亥:'巳'};
    var HAI = {子:'未',未:'子',丑:'午',午:'丑',寅:'巳',巳:'寅',卯:'辰',辰:'卯',申:'亥',亥:'申',酉:'戌',戌:'酉'};
    if(HE[a]===b) return '合';
    if(CHONG[a]===b) return '冲';
    if(HAI[a]===b) return '害';
    return '';
  }
  function hash(s){ var h=0; for(var i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))|0; } return Math.abs(h); }

  var POOLS = {
    '比肩':{yi:['约老朋友吃顿饭','把拖了很久的小事清掉','自己动手做点东西'],ji:['逞强揽活','和人比价','冲动下单'],line:'今天适合并肩，不适合较劲。'},
    '劫财':{yi:['把账目理一遍','该拒绝的局推掉','运动出汗'],ji:['给人做担保','借钱出去','抢着买单'],line:'人情热，钱包要冷。'},
    '食神':{yi:['好好吃一顿','写点东西','做手边最顺手的事'],ji:['赶工到深夜','节食','把日程排满'],line:'今天宜松不宜紧。'},
    '伤官':{yi:['提一个改法','把想法写清楚','做点不一样的东西'],ji:['当众反驳','情绪化发言','硬碰硬'],line:'锋芒收三分，事就成了。'},
    '偏财':{yi:['谈钱、谈合作','留意意外机会','清理订阅'],ji:['赌一把','大额冲动消费','轻信熟人项目'],line:'机会在，但别把运气当本事。'},
    '正财':{yi:['对账、报销','按计划推进','把该收的钱收了'],ji:['借钱给人','买不确定的东西','跳步骤'],line:'今天的一分耕耘，认一分收成。'},
    '七杀':{yi:['啃硬骨头','做需要决断的事','把话说清楚'],ji:['硬扛','熬夜','和上级顶牛'],line:'压力是磨刀石，别拿它磨自己。'},
    '正官':{yi:['按流程办','争取一个正式的名分','整理文书'],ji:['走捷径','越级','含糊承诺'],line:'规矩今天帮你，不碍你。'},
    '偏印':{yi:['研究冷门问题','独处','补一个短板'],ji:['三心二意','过度解读','临时改方案'],line:'想法多，挑一个做完。'},
    '正印':{yi:['读书、学习','请教前辈','把资料归档'],ji:['硬撑','拒绝帮助','赶进度'],line:'今天适合被提携，也适合提携自己。'}
  };

  function el(id){ return document.getElementById(id); }
  function toast(msg){
    var t = el('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
  }

  var birth = null;
  try { birth = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}

  // 分享链接: ?d=YYYY-MM-DD 直接出同一个人的今日签
  var qd = new URLSearchParams(location.search).get('d');
  if(qd && /^\d{4}-\d{2}-\d{2}$/.test(qd)){
    var qp = qd.split('-').map(Number);
    birth = { y: qp[0], m: qp[1], d: qp[2] };
  }

  function render(){
    var now = new Date();
    var y = now.getFullYear(), m = now.getMonth()+1, d = now.getDate();
    var today = dayGz(y, m, d);
    var b = birth;
    var bGz = dayGz(b.y, b.m, b.d);

    var ss = shiShen(bGz[0], today[0]);
    var r = rel(bGz[1], today[1]);
    var p = POOLS[ss] || POOLS['比肩'];

    var seed = hash(bGz + today);
    var yi = [p.yi[seed % p.yi.length], p.yi[(seed+1) % p.yi.length]];
    var ji = [p.ji[(seed>>2) % p.ji.length], p.ji[((seed>>2)+1) % p.ji.length]];

    var relTxt = r==='合' ? '今日与你相合，人和事都顺一点。'
              : r==='冲' ? '今日与你相冲，行程留点余量。'
              : r==='害' ? '今日与你相害，话到嘴边留半句。'
              : '今日与你无冲无合，按自己的节奏来。';

    var week = ['日','一','二','三','四','五','六'][now.getDay()];
    el('dDate').textContent = y + ' 年 ' + m + ' 月 ' + d + ' 日 · 周' + week;
    el('dGz').innerHTML = '今日 <b>' + today + '</b> · 你的日主 <b>' + bGz[0] + '</b>'
      + '<span class="ss">' + ss + '</span>';
    el('dYi').innerHTML = yi.map(function(x){ return '<li>'+x+'</li>'; }).join('');
    el('dJi').innerHTML = ji.map(function(x){ return '<li>'+x+'</li>'; }).join('');
    el('dCols').style.display = 'flex';
    el('dLine').innerHTML = p.line + '<span class="sub2">' + relTxt + '</span>';
    el('dFoot').textContent = '日柱 ' + bGz + ' · 同一人同一天，永出此签';

    window._share = '一纸日签 ' + y + '-' + (m<10?'0':'') + m + '-' + (d<10?'0':'') + d
      + ' ' + today + '｜宜：' + yi.join('、') + '｜忌：' + ji.join('、')
      + '｜一纸书房 dolow.dev';
    window._daily = {
      dateStr: y + '-' + (m<10?'0':'') + m + '-' + (d<10?'0':'') + d,
      today: today, bGz: bGz, ss: ss, yi: yi, ji: ji, line: p.line, rel: relTxt
    };
  }

  function showSetup(on){
    el('setup').classList.toggle('on', on);
    el('copyBtn').style.display = on ? 'none' : '';
    el('resetBtn').style.display = on ? 'none' : '';
    el('savePngBtn').style.display = on ? 'none' : '';
    el('linkBtn').style.display = on ? 'none' : '';
  }

  /* ---------- 国风日历盘 ---------- */
  function initPicker(fieldId, inputId){
    var field = el(fieldId), input = el(inputId), wrap = field.parentNode;
    var panel = document.createElement('div');
    panel.className = 'dp-panel'; panel.hidden = true;
    panel.innerHTML =
      '<div class="dp-head">' +
        '<button type="button" class="dp-nav" data-nav="py">‹‹</button>' +
        '<button type="button" class="dp-nav" data-nav="pm">‹</button>' +
        '<div class="dp-title"></div>' +
        '<button type="button" class="dp-nav" data-nav="nm">›</button>' +
        '<button type="button" class="dp-nav" data-nav="ny">››</button>' +
      '</div>' +
      '<div class="dp-week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>' +
      '<div class="dp-days"></div>';
    wrap.appendChild(panel);

    var today = new Date();
    var view = { y: today.getFullYear(), m: today.getMonth() };
    var MIN = 1901, MAX = 2026;

    function render(){
      panel.querySelector('.dp-title').textContent = view.y + ' 年 ' + (view.m + 1) + ' 月';
      var first = new Date(view.y, view.m, 1).getDay();
      var days = new Date(view.y, view.m + 1, 0).getDate();
      var html = '';
      for(var i=0;i<first;i++) html += '<button type="button" class="dp-day blank"></button>';
      var sel = input.value || '';
      for(var d=1; d<=days; d++){
        var v = view.y + '-' + (view.m+1<10?'0':'') + (view.m+1) + '-' + (d<10?'0':'') + d;
        html += '<button type="button" class="dp-day' + (v === sel ? ' on' : '') + '" data-v="' + v + '">' + d + '</button>';
      }
      panel.querySelector('.dp-days').innerHTML = html;
    }
    function open(){
      if(input.value){ var p = input.value.split('-').map(Number); view.y = p[0]; view.m = p[1]-1; }
      render(); panel.hidden = false;
    }
    function close(){ panel.hidden = true; }

    field.addEventListener('click', function(e){
      e.stopPropagation();
      panel.hidden ? open() : close();
    });
    panel.addEventListener('click', function(e){
      e.stopPropagation();
      var nav = e.target.closest('[data-nav]');
      if(nav){
        var k = nav.getAttribute('data-nav');
        if(k === 'pm'){ view.m--; if(view.m < 0){ view.m = 11; view.y--; } }
        if(k === 'nm'){ view.m++; if(view.m > 11){ view.m = 0; view.y++; } }
        if(k === 'py') view.y--;
        if(k === 'ny') view.y++;
        if(view.y < MIN) view.y = MIN;
        if(view.y > MAX) view.y = MAX;
        render(); return;
      }
      var day = e.target.closest('.dp-day[data-v]');
      if(day){
        set(day.getAttribute('data-v'));
        close();
      }
    });
    document.addEventListener('click', function(){ close(); });

    function set(v){
      input.value = v;
      var p = v.split('-').map(Number);
      field.textContent = p[0] + ' 年 ' + p[1] + ' 月 ' + p[2] + ' 日';
      field.classList.add('filled');
    }
    return { set: set };
  }

  var picker = initPicker('dpField', 'fDate');

  if(birth && birth.y && birth.m && birth.d){
    picker.set(birth.y + '-' + (birth.m<10?'0':'') + birth.m + '-' + (birth.d<10?'0':'') + birth.d);
    render();
  } else {
    el('dDate').textContent = '还没有生辰';
    el('dGz').textContent = '';
    el('dYi').innerHTML = ''; el('dJi').innerHTML = '';
    el('dCols').style.display = 'none';
    el('dLine').textContent = '填一个出生日期，就能出今日的签。';
    el('dFoot').textContent = '';
    showSetup(true);
  }

  el('saveBtn').addEventListener('click', function(){
    var v = el('fDate').value;
    if(!v){ toast('先选个日期'); return; }
    var p = v.split('-').map(Number);
    birth = { y:p[0], m:p[1], d:p[2] };
    try { localStorage.setItem(KEY, JSON.stringify(birth)); } catch(e){}
    showSetup(false);
    render();
    toast('记下了');
  });

  el('resetBtn').addEventListener('click', function(){
    showSetup(true);
  });

  el('copyBtn').addEventListener('click', function(){
    var txt = window._share || '';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('签文已复制'); }, function(){ toast('复制失败'); });
    } else {
      var ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
      ta.select(); try{ document.execCommand('copy'); toast('签文已复制'); }catch(e){ toast('复制失败'); }
      document.body.removeChild(ta);
    }
  });

  /* ---------- 海报 ---------- */
  var KAI = "KaiTi, STKaiti, 'Kaiti SC', STSong, SimSun, serif";
  var qrImg = new Image(); qrImg.src = '/assets/qr-daily.png';

  function wrap2(ctx, text, maxW){
    var lines = [], cur = '';
    for(var i=0;i<text.length;i++){
      var t = cur + text[i];
      if(ctx.measureText(t).width > maxW && cur){ lines.push(cur); cur = text[i]; }
      else cur = t;
    }
    if(cur) lines.push(cur);
    return lines;
  }

  function drawDailyPoster(){
    var D = window._daily; if(!D) return;
    var cv = el('posterCanvas'), ctx = cv.getContext('2d');
    var W = 750, H = 1334;
    ctx.clearRect(0,0,W,H);
    var g = ctx.createLinearGradient(0,0,W,H);
    g.addColorStop(0,'#f8f1e1'); g.addColorStop(1,'#e9ddc2');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle='rgba(164,52,42,.45)'; ctx.lineWidth=2; ctx.strokeRect(28,28,W-56,H-56);
    ctx.strokeStyle='rgba(160,124,28,.4)'; ctx.lineWidth=1; ctx.strokeRect(38,38,W-76,H-76);

    // 朱印
    ctx.fillStyle='#a4342a'; ctx.fillRect(W/2-34, 88, 68, 68);
    ctx.fillStyle='#f7efe0'; ctx.textAlign='center'; ctx.font='34px '+KAI;
    ctx.fillText('签', W/2, 136);

    ctx.fillStyle='#2b2419'; ctx.font='600 52px '+KAI;
    ctx.fillText('一 纸 日 签', W/2, 226);
    ctx.fillStyle='#8a7c5f'; ctx.font='22px '+KAI;
    ctx.fillText('同 一 人 · 同 一 天 · 同 一 签', W/2, 268);

    ctx.fillStyle='#6b5f49'; ctx.font='26px '+KAI;
    var dp = D.dateStr.split('-').map(Number);
    ctx.fillText(dp[0] + ' 年 ' + dp[1] + ' 月 ' + dp[2] + ' 日', W/2, 330);
    ctx.fillStyle='#2b2419'; ctx.font='28px '+KAI;
    ctx.fillText('今日 ' + D.today + ' · 日主 ' + D.bGz[0] + ' · ' + D.ss, W/2, 384);

    ctx.textAlign='left';
    ctx.fillStyle='#a4342a'; ctx.font='32px '+KAI; ctx.fillText('宜', 110, 470);
    ctx.fillStyle='#3b3122'; ctx.font='28px '+KAI;
    D.yi.forEach(function(t,i){ ctx.fillText('· ' + t, 175, 520 + i*52); });

    ctx.fillStyle='#4a3f2f'; ctx.font='32px '+KAI; ctx.fillText('忌', 110, 700);
    ctx.fillStyle='#3b3122'; ctx.font='28px '+KAI;
    D.ji.forEach(function(t,i){ ctx.fillText('· ' + t, 175, 750 + i*52); });

    ctx.textAlign='center';
    ctx.strokeStyle='rgba(160,124,28,.35)'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(150, 900); ctx.lineTo(W-150, 900); ctx.stroke();
    ctx.fillStyle='#3b3122'; ctx.font='27px '+KAI;
    var lines = wrap2(ctx, D.line, W - 190);
    lines.slice(0,3).forEach(function(l,i){ ctx.fillText(l, W/2, 950 + i*44); });
    ctx.fillStyle='#8a7c5f'; ctx.font='22px '+KAI;
    ctx.fillText(D.rel, W/2, 950 + lines.slice(0,3).length*44 + 22);

    // 落款 + 二维码
    ctx.textAlign='left';
    ctx.fillStyle='#6b5f49'; ctx.font='20px '+KAI;
    ctx.fillText('一纸日签 谨制 · 一纸书房', 80, 1160);
    ctx.fillStyle='#a89a79'; ctx.font='17px '+KAI;
    ctx.fillText('dolow.dev/daily', 80, 1196);

    if(qrImg.complete && qrImg.naturalWidth){
      ctx.fillStyle='#fff'; ctx.fillRect(W-250, 1070, 150, 150);
      ctx.drawImage(qrImg, W-244, 1076, 138, 138);
      ctx.textAlign='center';
      ctx.fillStyle='#8a7c5f'; ctx.font='17px '+KAI;
      ctx.fillText('扫码 · 看你今日一签', W-175, 1248);
    }
  }

  el('savePngBtn').addEventListener('click', function(){
    if(!window._daily){ toast('先起一签'); return; }
    drawDailyPoster();
    el('posterBox').classList.add('on');
    var a = document.createElement('a');
    a.download = '一纸日签_' + window._daily.dateStr + '.png';
    a.href = el('posterCanvas').toDataURL('image/png');
    a.click();
    toast('已存图');
  });

  el('linkBtn').addEventListener('click', function(){
    if(!birth){ toast('先填生辰'); return; }
    var d = birth.y + '-' + (birth.m<10?'0':'') + birth.m + '-' + (birth.d<10?'0':'') + birth.d;
    var url = location.origin + '/daily/?d=' + d;
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(function(){ toast('链接已复制'); }, function(){ toast(url); });
    } else { toast(url); }
  });
})();
</script>
<script>if(!navigator.doNotTrack||navigator.doNotTrack!=='1'){try{navigator.sendBeacon('/api/hit',JSON.stringify({p:location.pathname}))}catch(e){}}</script>
</body>
</html>
