title: "生辰还能这样写？国风排版太戳了"
content: |
  最近翻家里的旧历书，翻着翻着就想：如果把自己的生辰，按干支历法写成一张笺，会是什么样子？

  于是自己动手做了一个小工具，叫「一纸命笺」。

  它不聊天、不讲玄乎的故事，只做一件事：
  把公历生辰换成传统历法的四柱干支，再按五行的多寡、十神的分布，写出一段属于这张笺的「笺曰」。

  做的过程中有三个坚持：

  一、同一生辰，永出一笺。
  断语由规则生成，不是多刷几次就换一套说法。算得稳，才值得看。

  二、只讲传统历法的框架。
  四柱、五行、十神，落款用干支纪年。不是星座，也不是塔罗，是老祖宗那套历法体系。

  三、不做焦虑生意。
  没有付费解锁，没有「你命格有大凶」这种话术。末页只落一句：仅供传统文化参考。

  排版是我最花心思的地方：
  宣纸底、朱砂印、右起的年柱、竖排的干支，五行条按木火土金水的顺序铺开。生成的是一张竖版长图，存下来就能发给朋友。

  我自己是丙火，「两火如日，光照四方」——读完确实会心一笑。

  工具已经做好放在网页上，地址写在主页简介里，感兴趣可以去试试。
  也想问问大家：你的日主是什么？木火土金水，哪一行最多？
