<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这一页还没写 · 一纸书房</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<meta name="theme-color" content="#191510">
<style>
  :root{--paper:#f5eeda;--ink2:#b3a586;--gold:#a07c1c;--cinnabar:#a4342a}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'KaiTi','STKaiti','Kaiti SC','STSong','SimSun',serif;
    background:radial-gradient(900px 480px at 50% -120px, rgba(164,52,42,.14), transparent 60%),#191510;
    color:var(--ink2);min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:32px;text-align:center;
  }
  .box{max-width:420px}
  .seal{
    width:54px;height:54px;margin:0 auto 22px;border-radius:6px;transform:rotate(-3deg);
    background:linear-gradient(145deg,#b03a2e,#8c2a21);
    box-shadow:0 3px 10px rgba(0,0,0,.5), inset 0 0 0 2px rgba(247,239,224,.35);
    display:grid;place-items:center;color:#f7efe0;font-size:22px;letter-spacing:1px;
  }
  h1{font-size:28px;letter-spacing:8px;text-indent:8px;color:#e8d5a8;font-weight:600;margin-bottom:14px}
  p{font-size:14px;line-height:2;letter-spacing:1px}
  a{color:#b3a586;text-decoration:none;border-bottom:1px dashed rgba(179,165,134,.5)}
  a:hover{color:#f0e6cf}
  .back{margin-top:26px;display:inline-block;font-size:13px;letter-spacing:2px}
</style>
</head>
<body>
  <div class="box">
    <div class="seal">纸</div>
    <h1>这一页还没写</h1>
    <p>你要找的东西不在这张纸上。<br>书房不大，架上的东西都在首页。</p>
    <a class="back" href="/">← 回书房</a>
  </div>
</body>
</html>
